<!DOCTYPE html>
<!-- 
    Movie Library - Frontend Application
    ================================
    Это одностраничное приложение (SPA) на React для управления библиотекой фильмов.
    Приложение подключается к FastAPI бэкенду и предоставляет:
    - Аутентификацию пользователей (вход/регистрация)
    - Просмотр каталога фильмов
    - Добавление фильмов в избранное
    - Управление жанрами и режиссерами (только для суперпользователей)
    - Добавление новых фильмов (только для суперпользователей)
-->
<html lang="en">

<head>
    <!-- Мета-теги для корректного отображения -->
    <meta charset="UTF-8"> <!-- Кодировка UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Адаптивная вёрстка для мобильных устройств -->
    <title>Movie Library</title>
    
    <!-- 
        Подключение React и Babel через CDN
        React 18 - библиотека для создания пользовательских интерфейсов
        ReactDOM - для рендеринга React компонентов в DOM
        Babel - компилятор для трансформации JSX в обычный JavaScript в браузере
    -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Bootstrap 5 CSS - CSS фреймворк для стилизации компонентов -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* 
            Стили приложения в темной теме (Netflix-подобный стиль)
            ================================
        */
        
        /* Основной фон страницы - тёмно-синий */
        body {
            background-color: #1a1a2e;
            color: #eee;
        }

        /* Навигационная панель - более тёмный синий */
        .navbar {
            background-color: #16213e !important;
        }

        /* Карточки - тёмный фон с синей рамкой */
        .card {
            background-color: #16213e;
            border: 1px solid #0f3460;
            color: #eee;
        }

        /* Заголовок карточки */
        .card-header {
            background-color: #0f3460;
        }

        /* Поля ввода форм - тёмные с светлым текстом */
        .form-control {
            background-color: #0f3460;
            border: 1px solid #1a1a2e;
            color: #eee;
        }

        /* При фокусе на поле ввода */
        .form-control:focus {
            background-color: #1a1a2e;
            color: #eee;
        }

        /* Основная кнопка - красная (акцентный цвет как у Netflix) */
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }

        /* При наведении на кнопку - более тёмный красный */
        .btn-primary:hover {
            background-color: #c73e54;
            border-color: #c73e54;
        }

        /* Контурные кнопки - красная рамка и текст */
        .btn-outline-light {
            border-color: #e94560;
            color: #e94560;
        }

        /* При наведении - красный фон */
        .btn-outline-light:hover {
            background-color: #e94560;
            color: white;
        }

        /* Карточка фильма - анимация при наведении */
        .movie-card {
            transition: transform 0.2s; /* Плавное увеличение */
        }

        /* При наведении - увеличение на 2% */
        .movie-card:hover {
            transform: scale(1.02);
        }

        /* Рейтинг - золотой цвет */
        .rating {
            color: #ffd700;
        }

        /* Ссылки навигации - белый текст */
        .nav-link {
            color: #eee !important;
        }

        /* Активная ссылка - красный цвет */
        .nav-link.active {
            color: #e94560 !important;
        }

        /* Модальные окна - тёмный фон */
        .modal-content {
            background-color: #16213e;
            color: #eee;
        }

        /* Границы модального окна */
        .modal-header {
            border-bottom: 1px solid #0f3460;
        }

        .modal-footer {
            border-top: 1px solid #0f3460;
        }

        /* Выпадающие списки */
        .dropdown-menu {
            background-color: #16213e;
            border: 1px solid #0f3460;
        }

        .dropdown-item {
            color: #eee;
        }

        .dropdown-item:hover {
            background-color: #0f3460;
            color: #eee;
        }
    </style>
</head>

<body>
    <!-- Контейнер для React приложения -->
    <div id="root"></div>

    <!-- 
        Основной скрипт приложения на JSX (транспилируется Babel в обычный JS)
        ================================
    -->
    <script type="text/babel">
        // ============================================================
        // КОНСТАНТЫ И КОНФИГУРАЦИЯ
        // ============================================================
        
        // API_URL - базовый URL бэкенда
        // Все API запросы будут отправляться на этот адрес
        const API_BASE =
            typeof window !== 'undefined' && window.location.protocol === 'file:'
                ? 'http://127.0.0.1:8000'
                : (typeof window !== 'undefined' ? window.location.origin : 'http://127.0.0.1:8000');
        const API_URL = `${API_BASE}/api/v1`;

        // ============================================================
        // КОНТЕКСТ АУТЕНТИФИКАЦИИ
        // ============================================================
        
        // AuthContext - React Context для управления состоянием аутентификации
        // Позволяет передавать данные о пользователе между компонентами без пропсов
        const AuthContext = React.createContext();

        // ============================================================
        // ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ ДЛЯ API ЗАПРОСОВ
        // ============================================================
        
        /**
         * Универсальная функция для выполнения API запросов
         * @param {string} endpoint - API эндпоинт (например, '/movies/')
         * @param {object} options - дополнительные настройки fetch (method, body, headers)
         * @returns {Promise} - результат от API в формате JSON
         * 
         * Функция автоматически:
         * - Добавляет токен авторизации в заголовки
         * - Обрабатывает ошибку 401 (неавторизован) - удаляет токен и перезагружает страницу
         * - Парсит ответ и выбрасывает ошибки с деталями
         */
        const api = async (endpoint, options = {}) => {
            const token = localStorage.getItem('token');

            const headers = {
                'Content-Type': 'application/json',
                ...(token && { Authorization: `Bearer ${token}` }),
                ...options.headers
            };

            const response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });

            if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.reload();
                throw new Error('Session expired');
            }

            if (!response.ok) {
                let message = 'Something went wrong';
                try {
                    const error = await response.json();
                    if (Array.isArray(error.detail)) {
                        message = error.detail.map((d) => (d.msg ? `${d.loc}: ${d.msg}` : JSON.stringify(d))).join('; ');
                    } else if (typeof error.detail === 'string') {
                        message = error.detail;
                    }
                } catch (_) {
                    /* non-JSON body */
                }
                throw new Error(message);
            }

            if (response.status === 204) {
                return null;
            }
            const text = await response.text();
            return text ? JSON.parse(text) : null;
        };

        // ============================================================
        // КОМПОНЕНТ: Login (Вход и регистрация)
        // ============================================================
        
        /**
         * Компонент формы входа/регистрации
         * @param {function} onLogin - колбэк, вызываемый после успешного входа
         * 
         * Состояния:
         * - isRegister: true/false - переключение между входом и регистрацией
         * - formData: данные формы (username, password, email, full_name)
         * - error: сообщение об ошибке для отображения пользователю
         */
        function Login({ onLogin }) {
            // Состояние: режим регистрации или входа
            const [isRegister, setIsRegister] = React.useState(false);
            
            // Состояние: данные формы
            const [formData, setFormData] = React.useState({
                username: '',    // Имя пользователя
                password: '',    // Пароль
                email: '',       // Email (только при регистрации)
                full_name: ''    // Полное имя (только при регистрации)
            });
            
            // Состояние: сообщение об ошибке
            const [error, setError] = React.useState('');

            /**
             * Обработчик отправки формы
             * @param {Event} e - событие submit формы
             */
            const handleSubmit = async (e) => {
                e.preventDefault(); // Отменяем стандартную отправку формы
                setError('');       // Очищаем ошибки

                try {
                    // Если режим регистрации
                    if (isRegister) {
                        // Отправляем данные на эндпоинт регистрации
                        await api('/auth/register', {
                            method: 'POST',
                            body: JSON.stringify({
                                username: formData.username,
                                password: formData.password,
                                email: formData.email,
                                ...(formData.full_name ? { full_name: formData.full_name } : {}),
                            }),
                        });
                        // После успешной регистрации переключаем на вход
                        setIsRegister(false);
                        alert('Registration successful! Please login.');
                    } else {
                        // Режим входа - используем form-data формат для OAuth2
                        const formBody = new URLSearchParams();
                        formBody.append('username', formData.username);
                        formBody.append('password', formData.password);

                        // Отправляем запрос на вход
                        const response = await fetch(`${API_URL}/auth/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded', // Формат для OAuth2 password grant
                            },
                            body: formBody.toString()
                        });

                        // Проверяем успешность ответа
                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.detail || 'Login failed');
                        }

                        // Получаем токен из ответа
                        const data = await response.json();
                        // Сохраняем токен в localStorage
                        localStorage.setItem('token', data.access_token);
                        // Вызываем колбэк успешного входа
                        onLogin();
                    }
                } catch (err) {
                    // Ловим и отображаем ошибку
                    setError(err.message);
                }
            };

            // Рендер формы
            return (
                <div className="container mt-5">
                    <div className="row justify-content-center">
                        <div className="col-md-6">
                            <div className="card">
                                <div className="card-header">
                                    <h3 className="text-center">
                                        {isRegister ? 'Register' : 'Login'} {/* Заголовок формы */}
                                    </h3>
                                </div>
                                <div className="card-body">
                                    {/* Отображение ошибки, если есть */}
                                    {error && <div className="alert alert-danger">{error}</div>}
                                    
                                    {/* Форма входа/регистрации */}
                                    <form onSubmit={handleSubmit}>
                                        {/* Поле: Имя пользователя */}
                                        <div className="mb-3">
                                            <label className="form-label">Username</label>
                                            <input
                                                type="text"
                                                className="form-control"
                                                value={formData.username}
                                                onChange={(e) => setFormData({ ...formData, username: e.target.value })}
                                                required
                                            />
                                        </div>
                                        
                                        {/* Поля, видимые только при регистрации */}
                                        {isRegister && (
                                            <>
                                                {/* Поле: Email */}
                                                <div className="mb-3">
                                                    <label className="form-label">Email</label>
                                                    <input
                                                        type="email"
                                                        className="form-control"
                                                        value={formData.email}
                                                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                                                        required
                                                    />
                                                </div>
                                                {/* Поле: Полное имя */}
                                                <div className="mb-3">
                                                    <label className="form-label">Full Name</label>
                                                    <input
                                                        type="text"
                                                        className="form-control"
                                                        value={formData.full_name}
                                                        onChange={(e) => setFormData({ ...formData, full_name: e.target.value })}
                                                    />
                                                </div>
                                            </>
                                        )}
                                        
                                        {/* Поле: Пароль */}
                                        <div className="mb-3">
                                            <label className="form-label">Password</label>
                                            <input
                                                type="password"
                                                className="form-control"
                                                value={formData.password}
                                                onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                                                required
                                            />
                                        </div>
                                        
                                        {/* Кнопка отправки формы */}
                                        <button type="submit" className="btn btn-primary w-100">
                                            {isRegister ? 'Register' : 'Login'}
                                        </button>
                                    </form>
                                    
                                    {/* Ссылка для переключения между входом и регистрацией */}
                                    <div className="text-center mt-3">
                                        <button
                                            className="btn btn-link"
                                            onClick={() => setIsRegister(!isRegister)}
                                        >
                                            {isRegister ? 'Already have an account? Login' : "Don't have an account? Register"}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================
        // КОМПОНЕНТ: Navbar (Навигационная панель)
        // ============================================================
        
        /**
         * Компонент навигационной панели
         * @param {object} user - объект текущего пользователя
         * @param {function} onLogout - колбэк для выхода
         * @param {function} setActiveTab - колбэк для переключения вкладок
         * 
         * Отображает:
         * - Логотип приложения
         * - Ссылки на разделы (Movies, Favorites, Genres, Directors)
         * - Имя пользователя и кнопку выхода
         * - Разделы Genres и Directors видны только суперпользователю
         */
        function Navbar({ user, onLogout, setActiveTab }) {
            return (
                <nav className="navbar navbar-expand-lg navbar-dark">
                    <div className="container">
                        {/* Логотип - при клике переходим на главную (Movies) */}
                        <a className="navbar-brand" href="#" onClick={() => setActiveTab('movies')}>
                            🎬 Movie Library
                        </a>
                        
                        {/* Кнопка "гамбургер" для мобильных устройств */}
                        <button className="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                            <span className="navbar-toggler-icon"></span>
                        </button>
                        
                        {/* Меню навигации */}
                        <div className="collapse navbar-collapse" id="navbarNav">
                            <ul className="navbar-nav me-auto">
                                {/* Ссылка на фильмы */}
                                <li className="nav-item">
                                    <a className="nav-link" href="#" onClick={() => setActiveTab('movies')}>Movies</a>
                                </li>
                                {/* Ссылка на избранное */}
                                <li className="nav-item">
                                    <a className="nav-link" href="#" onClick={() => setActiveTab('favorites')}>Favorites</a>
                                </li>
                                {/* Ссылка на жанры - только для суперпользователя */}
                                {user?.is_superuser && (
                                    <>
                                        <li className="nav-item">
                                            <a className="nav-link" href="#" onClick={() => setActiveTab('genres')}>Genres</a>
                                        </li>
                                        {/* Ссылка на режиссёров - только для суперпользователя */}
                                        <li className="nav-item">
                                            <a className="nav-link" href="#" onClick={() => setActiveTab('directors')}>Directors</a>
                                        </li>
                                    </>
                                )}
                            </ul>
                            
                            {/* Правая часть: имя пользователя и кнопка выхода */}
                            <div className="d-flex align-items-center">
                                <span className="me-3">{user?.username}</span>
                                <button className="btn btn-outline-light btn-sm" onClick={onLogout}>Logout</button>
                            </div>
                        </div>
                    </div>
                </nav>
            );
        }

        // ============================================================
        // КОМПОНЕНТ: Movies (Каталог фильмов)
        // ============================================================
        
        /**
         * Компонент отображения и управления фильмами
         * @param {boolean} isSuperuser - флаг, является ли пользователь суперпользователем
         * 
         * Функционал:
         * - Загрузка и отображение списка фильмов
         * - Просмотр детальной информации о фильме (модальное окно)
         * - Добавление фильма в избранное
         * - Добавление нового фильма (только для суперпользователя)
         */
        function Movies({ isSuperuser }) {
            // Состояние: список фильмов
            const [movies, setMovies] = React.useState([]);
            
            // Состояние: список жанров для выпадающего списка
            const [genres, setGenres] = React.useState([]);
            
            // Состояние: список режиссёров для выпадающего списка
            const [directors, setDirectors] = React.useState([]);
            
            // Состояние: видимость модального окна добавления фильма
            const [showModal, setShowModal] = React.useState(false);
            
            // Состояние: видимость модального окна детальной информации
            const [showDetailModal, setShowDetailModal] = React.useState(false);
            
            // Состояние: выбранный фильм для детального просмотра
            const [selectedMovie, setSelectedMovie] = React.useState(null);
            
            // Состояние: данные формы нового фильма
            const [formData, setFormData] = React.useState({
                title: '',          // Название фильма
                description: '',    // Описание
                release_date: '',   // Дата выхода
                duration: '',       // Продолжительность в минутах
                rating: '',         // Рейтинг
                genre_id: '',       // ID жанра
                director_id: ''     // ID режиссёра
            });

            // При монтировании компонента загружаем данные
            React.useEffect(() => {
                loadMovies();
                if (isSuperuser) {
                    loadGenres();
                    loadDirectors();
                }
            }, [isSuperuser]);

            /**
             * Загрузка списка фильмов с API
             */
            const loadMovies = async () => {
                try {
                    const data = await api('/movies/');
                    setMovies(data);
                } catch (err) {
                    console.error(err);
                }
            };

            /**
             * Загрузка списка жанров с API
             */
            const loadGenres = async () => {
                try {
                    const data = await api('/genres/');
                    setGenres(data);
                } catch (err) {
                    console.error(err);
                }
            };

            /**
             * Загрузка списка режиссёров с API
             */
            const loadDirectors = async () => {
                try {
                    const data = await api('/directors/');
                    setDirectors(data);
                } catch (err) {
                    console.error(err);
                }
            };

            /**
             * Обработчик отправки формы создания фильма
             * @param {Event} e - событие submit формы
             */
            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    // Отправляем данные на API
                    await api('/movies/', {
                        method: 'POST',
                        body: JSON.stringify({
                            ...formData,
                            // Преобразуем строковые значения в числа
                            release_date: formData.release_date || null,
                            duration: formData.duration ? parseInt(formData.duration) : null,
                            rating: formData.rating ? parseFloat(formData.rating) : null,
                            genre_id: parseInt(formData.genre_id),
                            director_id: parseInt(formData.director_id)
                        })
                    });
                    // Закрываем модальное окно
                    setShowModal(false);
                    // Перезагружаем список фильмов
                    loadMovies();
                    // Очищаем форму
                    setFormData({
                        title: '',
                        description: '',
                        release_date: '',
                        duration: '',
                        rating: '',
                        genre_id: '',
                        director_id: ''
                    });
                } catch (err) {
                    alert(err.message);
                }
            };

            /**
             * Добавление фильма в избранное
             * @param {number} movieId - ID фильма
             */
            const addToFavorites = async (movieId) => {
                try {
                    await api('/favorites/', {
                        method: 'POST',
                        body: JSON.stringify({ movie_id: movieId })
                    });
                    alert('Added to favorites!');
                } catch (err) {
                    alert(err.message);
                }
            };

            /**
             * Открытие модального окна с детальной информацией о фильме
             * @param {object} movie - объект фильма
             */
            const openMovieDetail = (movie) => {
                setSelectedMovie(movie);
                setShowDetailModal(true);
            };

            // Рендер списка фильмов
            return (
                <div className="container mt-4">
                    {/* Заголовок и кнопка добавления */}
                    <div className="d-flex justify-content-between align-items-center mb-4">
                        <h2>Movies</h2>
                        {isSuperuser && (
                            <button className="btn btn-primary" onClick={() => setShowModal(true)}>
                                + Add Movie
                            </button>
                        )}
                    </div>

                    {/* Сетка карточек фильмов */}
                    <div className="row">
                        {movies.map(movie => (
                            <div key={movie.id} className="col-md-4 mb-4">
                                <div className="card movie-card h-100">
                                    <div className="card-body">
                                        {/* Название фильма */}
                                        <h5 className="card-title">{movie.title}</h5>
                                        {/* Описание (обрезано до 100 символов) */}
                                        <p className="card-text">{movie.description?.substring(0, 100)}...</p>
                                        {/* Жанр */}
                                        <p className="mb-1">
                                            <strong>Genre:</strong> {movie.genre?.name || 'N/A'}
                                        </p>
                                        {/* Режиссёр */}
                                        <p className="mb-1">
                                            <strong>Director:</strong> {movie.director ? `${movie.director.first_name} ${movie.director.last_name}` : 'N/A'}
                                        </p>
                                        {/* Год выпуска */}
                                        <p className="mb-1">
                                            <strong>Year:</strong> {movie.release_date ? movie.release_date.split('T')[0] : 'N/A'}
                                        </p>
                                        {/* Рейтинг */}
                                        <p className="mb-2 rating">
                                            <strong>★</strong> {movie.rating || 'N/A'}
                                        </p>
                                        {/* Кнопки действий */}
                                        <div className="d-flex gap-2">
                                            <button
                                                className="btn btn-outline-light btn-sm flex-grow-1"
                                                onClick={() => openMovieDetail(movie)}
                                            >
                                                Details
                                            </button>
                                            <button
                                                className="btn btn-outline-light btn-sm"
                                                onClick={() => addToFavorites(movie.id)}
                                            >
                                                ♡
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* 
                        МОДАЛЬНОЕ ОКНО: Детальная информация о фильме
                        Отображается когда showDetailModal = true и выбран фильм
                    */}
                    {showDetailModal && selectedMovie && (
                        <div className="modal show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.7)' }}>
                            <div className="modal-dialog modal-lg">
                                <div className="modal-content">
                                    <div className="modal-header">
                                        <h5 className="modal-title">{selectedMovie.title}</h5>
                                        <button type="button" className="btn-close" onClick={() => setShowDetailModal(false)}></button>
                                    </div>
                                    <div className="modal-body">
                                        <div className="row">
                                            <div className="col-12">
                                                <h6 className="text-muted">Description</h6>
                                                <p>{selectedMovie.description || 'No description available'}</p>

                                                <h6 className="text-muted mt-3">Details</h6>
                                                <p><strong>Genre:</strong> {selectedMovie.genre?.name || 'N/A'}</p>
                                                <p><strong>Director:</strong> {selectedMovie.director ? `${selectedMovie.director.first_name} ${selectedMovie.director.last_name}` : 'N/A'}</p>
                                                <p><strong>Biography:</strong> {selectedMovie.director?.biography || 'N/A'}</p>
                                                <p><strong>Release Date:</strong> {selectedMovie.release_date ? selectedMovie.release_date.split('T')[0] : 'N/A'}</p>
                                                <p><strong>Duration:</strong> {selectedMovie.duration ? `${selectedMovie.duration} min` : 'N/A'}</p>
                                                <p className="rating"><strong>Rating:</strong> ★ {selectedMovie.rating || 'N/A'}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button
                                            className="btn btn-primary"
                                            onClick={() => addToFavorites(selectedMovie.id)}
                                        >
                                            ♡ Add to Favorites
                                        </button>
                                        <button type="button" className="btn btn-secondary" onClick={() => setShowDetailModal(false)}>Close</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 
                        МОДАЛЬНОЕ ОКНО: Добавление нового фильма
                        Отображается когда showModal = true
                    */}
                    {showModal && (
                        <div className="modal show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }}>
                            <div className="modal-dialog">
                                <div className="modal-content">
                                    <div className="modal-header">
                                        <h5 className="modal-title">Add Movie</h5>
                                        <button type="button" className="btn-close" onClick={() => setShowModal(false)}></button>
                                    </div>
                                    <form onSubmit={handleSubmit}>
                                        <div className="modal-body">
                                            {/* Поле: Название */}
                                            <div className="mb-3">
                                                <label className="form-label">Title</label>
                                                <input
                                                    type="text"
                                                    className="form-control"
                                                    value={formData.title}
                                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                                    required
                                                />
                                            </div>
                                            {/* Поле: Описание */}
                                            <div className="mb-3">
                                                <label className="form-label">Description</label>
                                                <textarea
                                                    className="form-control"
                                                    value={formData.description}
                                                    onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                                                />
                                            </div>
                                            {/* Поле: Дата выхода */}
                                            <div className="mb-3">
                                                <label className="form-label">Release Date</label>
                                                <input
                                                    type="date"
                                                    className="form-control"
                                                    value={formData.release_date}
                                                    onChange={(e) => setFormData({ ...formData, release_date: e.target.value })}
                                                />
                                            </div>
                                            {/* Поле: Продолжительность */}
                                            <div className="mb-3">
                                                <label className="form-label">Duration (minutes)</label>
                                                <input
                                                    type="number"
                                                    className="form-control"
                                                    value={formData.duration}
                                                    onChange={(e) => setFormData({ ...formData, duration: e.target.value })}
                                                />
                                            </div>
                                            {/* Поле: Рейтинг */}
                                            <div className="mb-3">
                                                <label className="form-label">Rating</label>
                                                <input
                                                    type="number"
                                                    step="0.1"
                                                    max="10"
                                                    className="form-control"
                                                    value={formData.rating}
                                                    onChange={(e) => setFormData({ ...formData, rating: e.target.value })}
                                                />
                                            </div>
                                            {/* Выбор жанра */}
                                            <div className="mb-3">
                                                <label className="form-label">Genre</label>
                                                <select
                                                    className="form-control"
                                                    value={formData.genre_id}
                                                    onChange={(e) => setFormData({ ...formData, genre_id: e.target.value })}
                                                    required
                                                >
                                                    <option value="">Select Genre</option>
                                                    {genres.map(g => (
                                                        <option key={g.id} value={g.id}>{g.name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            {/* Выбор режиссёра */}
                                            <div className="mb-3">
                                                <label className="form-label">Director</label>
                                                <select
                                                    className="form-control"
                                                    value={formData.director_id}
                                                    onChange={(e) => setFormData({ ...formData, director_id: e.target.value })}
                                                    required
                                                >
                                                    <option value="">Select Director</option>
                                                    {directors.map(d => (
                                                        <option key={d.id} value={d.id}>{d.first_name} {d.last_name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                        <div className="modal-footer">
                                            <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Cancel</button>
                                            <button type="submit" className="btn btn-primary">Save</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ============================================================
        // КОМПОНЕНТ: Favorites (Избранное)
        // ============================================================
        
        /**
         * Компонент отображения избранных фильмов пользователя
         * 
         * Функционал:
         * - Загрузка списка избранных фильмов
         * - Удаление фильма из избранного
         */
        function Favorites() {
            // Состояние: список избранного
            const [favorites, setFavorites] = React.useState([]);

            // При монтировании загружаем избранное
            React.useEffect(() => {
                loadFavorites();
            }, []);

            /**
             * Загрузка списка избранных фильмов
             */
            const loadFavorites = async () => {
                try {
                    const data = await api('/favorites/');
                    setFavorites(data);
                } catch (err) {
                    console.error(err);
                }
            };

            /**
             * Удаление фильма из избранного
             * @param {number} id - ID записи в избранном
             */
            const removeFavorite = async (id) => {
                try {
                    await api(`/favorites/${id}`, { method: 'DELETE' });
                    loadFavorites(); // Перезагружаем список
                } catch (err) {
                    alert(err.message);
                }
            };

            // Рендер
            return (
                <div className="container mt-4">
                    <h2>My Favorites</h2>
                    <div className="row">
                        {/* Если избранное пусто */}
                        {favorites.length === 0 ? (
                            <div className="col-12">
                                <p className="text-center">No favorites yet. Add some movies!</p>
                            </div>
                        ) : (
                            // Иначе отображаем карточки
                            favorites.map(fav => (
                                <div key={fav.id} className="col-md-4 mb-4">
                                    <div className="card h-100">
                                        <div className="card-body">
                                            {/* Название фильма (из вложенного объекта movie) */}
                                            <h5 className="card-title">{fav.movie?.title}</h5>
                                            <p className="mb-1">
                                                <strong>Genre:</strong> {fav.movie?.genre?.name || 'N/A'}
                                            </p>
                                            <p className="mb-1">
                                                <strong>Director:</strong> {fav.movie?.director ? `${fav.movie.director.first_name} ${fav.movie.director.last_name}` : 'N/A'}
                                            </p>
                                            <p className="mb-2 rating">
                                                <strong>★</strong> {fav.movie?.rating || 'N/A'}
                                            </p>
                                            <button
                                                className="btn btn-outline-danger btn-sm"
                                                onClick={() => removeFavorite(fav.id)}
                                            >
                                                Remove
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        // ============================================================
        // КОМПОНЕНТ: Genres (Управление жанрами)
        // ============================================================
        
        /**
         * Компонент управления жанрами фильмов (только для суперпользователя)
         * 
         * Функционал:
         * - Просмотр списка жанров
         * - Добавление нового жанра
         * - Удаление жанра
         */
        function Genres() {
            // Состояние: список жанров
            const [genres, setGenres] = React.useState([]);
            
            // Состояние: видимость модального окна
            const [showModal, setShowModal] = React.useState(false);
            
            // Состояние: название нового жанра
            const [newGenre, setNewGenre] = React.useState('');

            // При монтировании загружаем жанры
            React.useEffect(() => {
                loadGenres();
            }, []);

            /**
             * Загрузка списка жанров
             */
            const loadGenres = async () => {
                try {
                    const data = await api('/genres/');
                    setGenres(data);
                } catch (err) {
                    console.error(err);
                }
            };

            /**
             * Обработчик создания жанра
             */
            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    await api('/genres/', {
                        method: 'POST',
                        body: JSON.stringify({ name: newGenre })
                    });
                    setShowModal(false);
                    setNewGenre('');
                    loadGenres();
                } catch (err) {
                    alert(err.message);
                }
            };

            /**
             * Удаление жанра
             * @param {number} id - ID жанра
             */
            const deleteGenre = async (id) => {
                try {
                    await api(`/genres/${id}`, { method: 'DELETE' });
                    loadGenres();
                } catch (err) {
                    alert(err.message);
                }
            };

            // Рендер
            return (
                <div className="container mt-4">
                    <div className="d-flex justify-content-between align-items-center mb-4">
                        <h2>Genres</h2>
                        <button className="btn btn-primary" onClick={() => setShowModal(true)}>
                            + Add Genre
                        </button>
                    </div>
                    <div className="row">
                        {genres.map(genre => (
                            <div key={genre.id} className="col-md-3 mb-3">
                                <div className="card">
                                    <div className="card-body d-flex justify-content-between align-items-center">
                                        <span>{genre.name}</span>
                                        <button
                                            className="btn btn-outline-danger btn-sm"
                                            onClick={() => deleteGenre(genre.id)}
                                        >
                                            ✕
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Модальное окно добавления жанра */}
                    {showModal && (
                        <div className="modal show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }}>
                            <div className="modal-dialog">
                                <div className="modal-content">
                                    <div className="modal-header">
                                        <h5 className="modal-title">Add Genre</h5>
                                        <button type="button" className="btn-close" onClick={() => setShowModal(false)}></button>
                                    </div>
                                    <form onSubmit={handleSubmit}>
                                        <div className="modal-body">
                                            <div className="mb-3">
                                                <label className="form-label">Genre Name</label>
                                                <input
                                                    type="text"
                                                    className="form-control"
                                                    value={newGenre}
                                                    onChange={(e) => setNewGenre(e.target.value)}
                                                    required
                                                />
                                            </div>
                                        </div>
                                        <div className="modal-footer">
                                            <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Cancel</button>
                                            <button type="submit" className="btn btn-primary">Save</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ============================================================
        // КОМПОНЕНТ: Directors (Управление режиссёрами)
        // ============================================================
        
        /**
         * Компонент управления режиссёрами (только для суперпользователя)
         * 
         * Функционал:
         * - Просмотр списка режиссёров
         * - Добавление нового режиссёра
         * - Удаление режиссёра
         */
        function Directors() {
            // Состояние: список режиссёров
            const [directors, setDirectors] = React.useState([]);
            
            // Состояние: видимость модального окна
            const [showModal, setShowModal] = React.useState(false);
            
            // Состояние: данные формы
            const [formData, setFormData] = React.useState({
                first_name: '',   // Имя
                last_name: '',    // Фамилия
                biography: ''     // Биография
            });

            // При монтировании загружаем режиссёров
            React.useEffect(() => {
                loadDirectors();
            }, []);

            /**
             * Загрузка списка режиссёров
             */
            const loadDirectors = async () => {
                try {
                    const data = await api('/directors/');
                    setDirectors(data);
                } catch (err) {
                    console.error(err);
                }
            };

            /**
             * Обработчик создания режиссёра
             */
            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    await api('/directors/', {
                        method: 'POST',
                        body: JSON.stringify(formData)
                    });
                    setShowModal(false);
                    setFormData({ first_name: '', last_name: '', biography: '' });
                    loadDirectors();
                } catch (err) {
                    alert(err.message);
                }
            };

            /**
             * Удаление режиссёра
             * @param {number} id - ID режиссёра
             */
            const deleteDirector = async (id) => {
                try {
                    await api(`/directors/${id}`, { method: 'DELETE' });
                    loadDirectors();
                } catch (err) {
                    alert(err.message);
                }
            };

            // Рендер
            return (
                <div className="container mt-4">
                    <div className="d-flex justify-content-between align-items-center mb-4">
                        <h2>Directors</h2>
                        <button className="btn btn-primary" onClick={() => setShowModal(true)}>
                            + Add Director
                        </button>
                    </div>
                    <div className="row">
                        {directors.map(director => (
                            <div key={director.id} className="col-md-4 mb-4">
                                <div className="card h-100">
                                    <div className="card-body">
                                        <h5 className="card-title">{director.first_name} {director.last_name}</h5>
                                        <p className="card-text">{director.biography}</p>
                                        <button
                                            className="btn btn-outline-danger btn-sm"
                                            onClick={() => deleteDirector(director.id)}
                                        >
                                            Delete
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Модальное окно добавления режиссёра */}
                    {showModal && (
                        <div className="modal show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }}>
                            <div className="modal-dialog">
                                <div className="modal-content">
                                    <div className="modal-header">
                                        <h5 className="modal-title">Add Director</h5>
                                        <button type="button" className="btn-close" onClick={() => setShowModal(false)}></button>
                                    </div>
                                    <form onSubmit={handleSubmit}>
                                        <div className="modal-body">
                                            <div className="mb-3">
                                                <label className="form-label">First Name</label>
                                                <input
                                                    type="text"
                                                    className="form-control"
                                                    value={formData.first_name}
                                                    onChange={(e) => setFormData({ ...formData, first_name: e.target.value })}
                                                    required
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label className="form-label">Last Name</label>
                                                <input
                                                    type="text"
                                                    className="form-control"
                                                    value={formData.last_name}
                                                    onChange={(e) => setFormData({ ...formData, last_name: e.target.value })}
                                                    required
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label className="form-label">Biography</label>
                                                <textarea
                                                    className="form-control"
                                                    value={formData.biography}
                                                    onChange={(e) => setFormData({ ...formData, biography: e.target.value })}
                                                />
                                            </div>
                                        </div>
                                        <div className="modal-footer">
                                            <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Cancel</button>
                                            <button type="submit" className="btn btn-primary">Save</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ============================================================
        // КОМПОНЕНТ: App (Главный компонент)
        // ============================================================
        
        /**
         * Главный компонент приложения
         * Управляет состоянием:
         * - user: текущий пользователь (null если не авторизован)
         * - activeTab: активная вкладка (movies/favorites/genres/directors)
         * - loading: состояние загрузки при проверке аутентификации
         * 
         * Логика:
         * 1. При загрузке проверяет наличие токена в localStorage
         * 2. Если токен есть - пытается получить данные пользователя
         * 3. Если пользователь не авторизован - показывает форму входа
         * 4. Если авторизован - показывает основной интерфейс с навигацией
         */
        function App() {
            // Состояние: данные текущего пользователя
            const [user, setUser] = React.useState(null);
            
            // Состояние: активная вкладка
            const [activeTab, setActiveTab] = React.useState('movies');
            
            // Состояние: загрузка
            const [loading, setLoading] = React.useState(true);

            // При монтировании компонента проверяем аутентификацию
            React.useEffect(() => {
                checkAuth();
            }, []);

            /**
             * Проверка аутентификации
             * Пытается получить данные пользователя по токену
             */
            const checkAuth = async () => {
                const token = localStorage.getItem('token');
                if (token) {
                    try {
                        // Запрашиваем данные текущего пользователя
                        const userData = await api('/users/me');
                        setUser(userData);
                    } catch (err) {
                        // Если токен недействителен - удаляем его
                        localStorage.removeItem('token');
                    }
                }
                // Завершаем загрузку
                setLoading(false);
            };

            /**
             * Обработчик успешного входа
             * Перезагружает данные пользователя
             */
            const handleLogin = () => {
                checkAuth();
            };

            /**
             * Обработчик выхода
             * Удаляет токен и сбрасывает состояние пользователя
             */
            const handleLogout = () => {
                localStorage.removeItem('token');
                setUser(null);
            };

            // Показываем индикатор загрузки
            if (loading) {
                return <div className="text-center mt-5">Loading...</div>;
            }

            // Если пользователь не авторизован - показываем форму входа
            if (!user) {
                return <Login onLogin={handleLogin} />;
            }

            // Основной интерфейс
            return (
                <>
                    {/* Навигационная панель */}
                    <Navbar user={user} onLogout={handleLogout} setActiveTab={setActiveTab} />
                    
                    {/* Контент в зависимости от активной вкладки */}
                    {activeTab === 'movies' && <Movies isSuperuser={user.is_superuser} />}
                    {activeTab === 'favorites' && <Favorites />}
                    {activeTab === 'genres' && user.is_superuser && <Genres />}
                    {activeTab === 'directors' && user.is_superuser && <Directors />}
                </>
            );
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
        // ============================================================
        
        // Находим корневой элемент в DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        
        // Рендерим главный компонент App в корневой элемент
        root.render(<App />);
    </script>
    
    <!-- Bootstrap JavaScript - для работы модальных окон и навигации -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
